version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: mitraos-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
      POSTGRES_DB: mitraos_db
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mitraos-backend
    restart: unless-stopped
    depends_on:
      - postgres
    environment:
      DATABASE_URL: postgresql://postgres:postgrespassword@postgres:5432/mitraos_db
      SECRET_KEY: mitraos_secret_compose_key
      RAZORPAY_KEY_ID: rzp_test_mock_mitraos_key
      RAZORPAY_KEY_SECRET: rzp_secret_mock_mitraos_secret
      RAZORPAY_WEBHOOK_SECRET: rzp_webhook_secret_mock
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: mitraos-frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  pgdata:
