services:
  - type: web
    name: mitraos-autonomous-early-warning-action
    env: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --app-dir backend
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.8
      - key: PROJECT_NAME
        value: MitraOS
      - key: DATABASE_URL
        value: sqlite:///./mitraos.db
      - key: FRONTEND_URL
        value: https://mitra-os-rho.vercel.app
      - key: SECRET_KEY
        generateValue: true
      - key: RAZORPAY_KEY_ID
        value: rzp_test_mock_mitraos_key
      - key: RAZORPAY_KEY_SECRET
        value: rzp_secret_mock_mitraos_secret
      - key: RAZORPAY_WEBHOOK_SECRET
        value: rzp_webhook_secret_mock
